  # === 2. The MCP server (for Claude Desktop / remote agents) ===
  - type: web
    name: bk-jr-recruiter-mcp
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    # Override CMD to run the MCP wrapper (streamable HTTP on port 8080)
    entrypoint: ["python", "-m", "src.mcp_main", "--host", "0.0.0.0", "--port", "8080"]
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: "8080"
      - key: PYTHONUNBUFFERED
        value: "1"
      # === KEY FIX: point at the Render-hosted BACKEND, not the local cloudflared tunnel ===
      - key: BACKEND_URL
        value: https://bk-jr-recruiter-backend.onrender.com
      - key: MCP_TRANSPORT
        value: http
      # === Auth (REQUIRED — clients send Authorization: Bearer <MCP_AUTH_TOKEN>) ===
      # Override this in the Render dashboard with a strong random string.
      - key: MCP_AUTH_TOKEN
        value: CHANGE-ME-IN-RENDER-DASHBOARD-32-CHARS-MIN
