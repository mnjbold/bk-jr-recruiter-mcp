# Render Blueprint for BK Jr. — TWO services: backend + MCP.
# Both use the same Docker image. CMD/entrypoint differs per service.

services:
  # === 1. The FastAPI backend (the actual work) ===
  - type: web
    name: bk-jr-recruiter-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    # Override CMD to run the backend (uvicorn on port 8080) instead of the MCP
    entrypoint: ["python", ".run_backend.py"]
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: "8080"
      - key: PYTHONUNBUFFERED
        value: "1"
      # === Quo / OpenPhone ===
